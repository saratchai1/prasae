name: Audit all-plot portfolio readiness

on:
  push:
    branches: [feat/all-plots-portfolio-audit-20261003]
    paths:
      - tests/audit_all_plots.py
      - .github/workflows/audit-all-plots.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit committed all-plot dataset
        run: python tests/audit_all_plots.py
