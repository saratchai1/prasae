name: PDD22 R2 release checks
on:
  push:
    branches: [fix/pdd22-spectral-r2-release-20260930]
permissions:
  contents: read
concurrency:
  group: pdd22-r2-release-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm source data unchanged
        shell: bash
        run: |
          test "$(git rev-parse HEAD:data)" = "6a59a5dde1eda545ec7b3fe5d873df8e90948f36"
          git diff --exit-code
      - name: Syntax and unit tests
        run: |
          node --check pdd22-spectral-core.js
          node --check pdd22-spectral-studio.js
          python -m py_compile tests/pdd22-r2-real-assets.py
          node --test tests/pdd22-observations.test.cjs tests/pdd22-r2-release.test.cjs
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('CHROMIUM_PATH='+p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Phase-one regression fixtures
        run: python tests/pdd22-dom.test.py
      - name: Real source PNG audit and browser checks
        run: python tests/pdd22-r2-real-assets.py
      - name: Preserve verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdd22-r2-verification
          path: .local/r2-release/
          retention-days: 7
          if-no-files-found: ignore
