name: Deploy calibrated Prasae site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-prasae-site.yml

permissions:
  contents: write

concurrency:
  group: deploy-prasae-site
  cancel-in-progress: true

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-verified.txt

      - name: Install dependencies
        run: pip install -r requirements-verified.txt

      - name: Validate JavaScript and Python
        run: |
          node --check app.js
          node --check metrics-v2.js
          node --check metrics-v4.js
          node --check compare-swipe.js
          python -m py_compile process_verified_12_dates.py process_verified_12_dates_v4.py calibrate_green_proxy.py

      - name: Calibrate 13-STC threshold
        env:
          PRASAE_CALIBRATION_MAX_SCENES: '8'
        run: python calibrate_green_proxy.py

      - name: Build PLOT_076 verified 12-date dataset
        env:
          PRASAE_PLOT_IDS: '76'
          PRASAE_WORKERS: '1'
          PRASAE_MAX_SCENES: '5'
        run: python process_verified_12_dates_v4.py

      - name: Validate Prasae output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          calibration = json.loads(Path('data/calibration/green_proxy_calibration.json').read_text())
          data = json.loads(Path('data/timeseries_verified_12.json').read_text())
          assert len(data) == 1 and data[0]['id'] == 76
          plot = data[0]
          assert plot['proxy_version'] == 'v4_site_calibrated_green_cover'
          assert len(plot['timeseries']) == 12
          expected = calibration['selected_threshold'] if calibration['status'] == 'PROMOTED_DRONE_CALIBRATED' else 0.25
          assert abs(plot['green_proxy_threshold'] - expected) < 1e-9
          observed = [d for d in plot['timeseries'] if d['status'] in {'observed_single_scene','observed_monthly_composite'}]
          assert len(observed) >= 8
          for d in observed:
            assert abs(d['green_proxy_threshold'] - expected) < 1e-9
            parts = [d['vegetation_coverage_proxy_pct'], d['open_water_pct'], d['open_nonvegetated_pct']]
            assert all(0 <= v <= 100 for v in parts)
            assert abs(sum(parts) - 100) <= 0.3
          print(json.dumps({'calibration_status': calibration['status'], 'threshold': expected, 'observed_dates': len(observed), 'initial_ndvi': plot.get('initial_ndvi'), 'current_ndvi': plot.get('current_ndvi'), 'current_green_cover': plot.get('current_vegetation_proxy_pct')}, indent=2))
          PY

      - name: Commit site data for deployment branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calibration/green_proxy_calibration.json data/timeseries_verified_12.json data/plots/76
          if ! git diff --cached --quiet; then
            git commit -m "Deploy calibrated Prasae 12-date metrics"
          fi
          git fetch origin gh-pages
          git push --force-with-lease origin HEAD:gh-pages
