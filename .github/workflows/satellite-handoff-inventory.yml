name: Satellite input handoff inventory
on:
  push:
    branches: [handoff/satellite-inputs-20261003]
    paths: [tools/build_satellite_handoff.py, docs/ANTIGRAVITY_IMAGERY_HANDOFF.md, .github/workflows/satellite-handoff-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory committed files without querying or modifying satellite providers
        run: python tools/build_satellite_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: prasae-antigravity-satellite-handoff
          path: satellite-handoff/
          if-no-files-found: error
          retention-days: 14
