name: Unified 210 workspace check
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - unified-data.js
      - unified-workspace.js
      - unified-workspace.css
      - index.html
      - pdd22-spectral-studio.js
      - tests/unified-workspace-browser.py
      - tests/test_drive_batch_audit.py
      - tools/audit_drive_batches.py
      - data/timeseries_verified_12.json
      - data/all_plots_visual_qa.json
      - data/plots/**
      - .github/workflows/unified-workspace-check.yml
  push:
    branches: [gh-pages]
    paths:
      - unified-data.js
      - unified-workspace.js
      - unified-workspace.css
      - index.html
      - pdd22-spectral-studio.js
      - tests/unified-workspace-browser.py
      - tests/test_drive_batch_audit.py
      - tools/audit_drive_batches.py
      - data/timeseries_verified_12.json
      - data/all_plots_visual_qa.json
      - data/plots/**
      - .github/workflows/unified-workspace-check.yml
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Syntax and source integrity
        run: |
          node --check unified-data.js
          node --check unified-workspace.js
          node --check pdd22-spectral-studio.js
          python tests/all-plots-source-audit.py
      - name: Drive batch inventory parser regression
        run: python tests/test_drive_batch_audit.py
      - name: Temporary live Drive inventory (read-only audit)
        run: |
          python -m pip install --quiet gdown==5.2.0
          mkdir -p incoming
          python - <<'PY'
          import gdown
          url = "https://drive.google.com/drive/folders/1mC8mnCCXW2-WsyJYOLZNc-HIwoKrNxYn"
          out = gdown.download_folder(url=url, output="incoming", quiet=False, remaining_ok=True)
          print("downloaded", len(out or []), "items")
          PY
          python tools/audit_drive_batches.py
      - uses: actions/upload-artifact@v4
        with:
          name: drive-satellite-batch-inventory-pr-check
          path: audit-artifacts/drive_batch_inventory.*
          retention-days: 2
      - name: Install dependencies for exact-month Drive ingestion
        run: |
          python -m pip install --quiet numpy==2.2.6 Pillow==11.3.0 rasterio==1.4.3 shapely==2.1.1 pyproj==3.7.2 pystac-client==0.9.0 planetary-computer==1.0.0
      - name: Ingest genuinely missing registry observations (review artifact only)
        run: python tools/ingest_drive_missing_observations.py
      - name: Regenerate conservative visual QA
        run: |
          python tests/build_all_plots_visual_qa.py
          cp audit-artifacts/all_plots_visual_qa.json data/all_plots_visual_qa.json
      - name: Verify source integrity after ingestion
        run: python tests/all-plots-source-audit.py
      - name: Export reviewable patch without production writes
        run: |
          git add data/timeseries_verified_12.json data/all_plots_visual_qa.json data/plots
          git diff --cached --binary > audit-artifacts/accepted-observations.patch
      - uses: actions/upload-artifact@v4
        with:
          name: drive-missing-observation-ingest-pr-check
          path: audit-artifacts/
          retention-days: 2
      - name: Chromium
        run: |
          python -m pip install playwright==1.64.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('CHROMIUM_PATH='+p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Actual 210-plot browser verification
        run: python tests/unified-workspace-browser.py
