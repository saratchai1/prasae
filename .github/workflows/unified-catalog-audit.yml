name: Unified catalog mapping audit
on:
  push:
    branches: [gh-pages]
    paths: [tests/audit_unified_catalog.py, .github/workflows/unified-catalog-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install shapely==2.1.1
      - run: python tests/audit_unified_catalog.py
