name: Drive satellite batch inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download current Drive folder
        run: |
          python -m pip install --quiet gdown==5.2.0
          mkdir -p incoming
          python - <<'PY'
          import gdown
          url="https://drive.google.com/drive/folders/1mC8mnCCXW2-WsyJYOLZNc-HIwoKrNxYn"
          out=gdown.download_folder(url=url, output="incoming", quiet=False, remaining_ok=True)
          print("downloaded", len(out or []), "items")
          PY
          find incoming -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - name: Inventory ZIP contents
        run: python tools/audit_drive_batches.py
      - uses: actions/upload-artifact@v4
        with:
          name: drive-satellite-batch-inventory
          path: audit-artifacts/
          retention-days: 14
