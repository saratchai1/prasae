name: Validate Drive reflectance encoding
on:
  push:
    branches: [gh-pages]
    paths:
      - tools/validate_drive_reflectance.py
      - .github/workflows/validate-drive-reflectance.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download current Drive folder
        run: |
          python -m pip install --quiet gdown==5.2.0
          mkdir -p incoming
          python - <<'PY'
          import gdown
          gdown.download_folder(url="https://drive.google.com/drive/folders/1mC8mnCCXW2-WsyJYOLZNc-HIwoKrNxYn",output="incoming",quiet=False,remaining_ok=True)
          PY
      - name: Validate radiometric offset against committed verified NDVI
        run: |
          python -m pip install --quiet rasterio==1.4.3 shapely==2.1.1 numpy==2.2.6
          python tools/validate_drive_reflectance.py
      - uses: actions/upload-artifact@v4
        with:
          name: reflectance-offset-validation
          path: audit-artifacts/reflectance_offset_validation.json
          retention-days: 14
