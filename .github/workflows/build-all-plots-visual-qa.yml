name: Build conservative all-plot visual QA
on:
  push:
    branches: [fix/all-plots-qa-viewer-20261003]
    paths:
      - tests/build_all_plots_visual_qa.py
      - .github/workflows/build-all-plots-visual-qa.yml
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install Pillow==11.3.0 numpy==2.2.6
      - run: python tests/build_all_plots_visual_qa.py
      - name: Commit generated QA dataset
        run: |
          cp audit-artifacts/all_plots_visual_qa.json data/all_plots_visual_qa.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/all_plots_visual_qa.json
          git commit -m "data: add conservative visual QA for general plots"
          git push origin HEAD:fix/all-plots-qa-viewer-20261003
      - uses: actions/upload-artifact@v4
        with:
          name: all-plots-visual-qa
          path: audit-artifacts/all_plots_visual_qa.json
          retention-days: 7
