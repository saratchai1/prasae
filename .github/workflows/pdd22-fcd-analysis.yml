name: PDD22 corrected FCD screening

on:
  workflow_dispatch:
  push:
    branches:
      - pdd22-fcd-monitoring
    paths:
      - process_pdd22_fcd_v2.py
      - process_pdd22_fcd.py
      - extract_pdd22_plots.py
      - pdd22_config.py
      - my-land/STC_VSD_EVR.kmz
      - requirements-verified.txt
      - .github/workflows/pdd22-fcd-analysis.yml

permissions:
  contents: write

concurrency:
  group: pdd22-corrected-v2
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-verified.txt

      - name: Install dependencies
        run: pip install -r requirements-verified.txt

      - name: Validate code and exact PDD participating boundaries
        run: |
          python -m py_compile process_pdd22_fcd_v2.py process_pdd22_fcd.py extract_pdd22_plots.py pdd22_config.py
          python extract_pdd22_plots.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/pdd22/plots_catalog.json').read_text(encoding='utf-8'))
          assert len(p) == 22
          assert round(sum(float(x['area_rai']) for x in p), 2) == 6775.53
          print('Validated 22 participating PDD plots, 6,775.53 rai')
          PY

      - name: Build corrected March and August FCD series
        env:
          PRASAE_MAX_SCENES: '4'
          PDD22_REFERENCE_SAMPLE: '6000'
          PDD22_V2_WORKERS: '6'
        run: python process_pdd22_fcd_v2.py

      - name: Validate outputs and scientific guardrails
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('data/pdd22_v2')
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['model_version'] == 'pdd22_v2_pdd_anchored'
          assert manifest['plot_count'] == 22
          carbon = json.loads((root/'carbon_screening.json').read_text(encoding='utf-8'))
          assert carbon['satellite_adjusted_credit_tco2e'] is None
          ranks = list(csv.DictReader((root/'plot_change_ranking.csv').open(encoding='utf-8-sig')))
          assert len(ranks) == 22
          for series in ['march','august']:
              r = json.loads((root/f'{series}_result.json').read_text(encoding='utf-8'))
              assert len(r['plots']) == 22 and len(r['portfolio']) == 4
              assert r['calibration']['pc1_ndvi_corr'] <= 0.0
              ref = r['portfolio'][0]
              total = ref['green_rai'] + ref['yellow_rai'] + ref['red_rai'] + ref['bare_error_alloc_rai']
              assert abs(total - 6775.53) < 5.0, (series, total)
              print(series, 'reference', ref)
              print(series, '2026', r['portfolio'][-1])
          print((root/'EXECUTIVE_SUMMARY.md').read_text(encoding='utf-8'))
          PY

      - name: Upload corrected screening artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdd22-corrected-fcd-v2
          path: data/pdd22_v2
          retention-days: 30

      - name: Commit corrected outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pdd22 data/pdd22_v2
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Build corrected PDD22 FCD v2 results"
          git push origin HEAD:${GITHUB_REF_NAME}
