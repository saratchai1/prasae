name: Build Spectral Studio assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - build_spectral_assets.py
      - spectral-studio.js
      - .github/workflows/build-spectral-assets.yml

permissions:
  contents: write

concurrency:
  group: spectral-studio-assets
  cancel-in-progress: true

jobs:
  build-prasae:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-verified.txt

      - name: Install dependencies
        run: pip install -r requirements-verified.txt

      - name: Validate code
        run: |
          node --check spectral-studio.js
          python -m py_compile build_spectral_assets.py process_verified_12_dates.py

      - name: Build exact-date spectral assets for 13-STC
        env:
          PRASAE_PLOT_IDS: '76'
          PRASAE_SPECTRAL_MAX_SCENES: '5'
          PRASAE_WORKERS: '1'
        run: python build_spectral_assets.py

      - name: Validate all 12 declared dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          expected_months = [
              '2023-09','2023-12','2024-03','2024-06',
              '2024-09','2024-12','2025-03','2025-06',
              '2025-09','2025-12','2026-03','2026-08',
          ]
          expected_bands = {'B02','B03','B04','B08','B11','B12'}
          plot_dir = Path('data/plots/76')
          manifest = json.loads((plot_dir / 'spectral_manifest.json').read_text(encoding='utf-8'))
          assert manifest['plot_id'] == 76
          assert manifest['asset_role'] == 'browser_visualization_only'
          assert manifest['rules']['exact_declared_month_only'] is True
          assert manifest['rules']['nearest_month_fallback'] is False
          assert manifest['rules']['interpolation'] is False
          assert manifest['rules']['synthetic_imagery'] is False
          assert [item['month'] for item in manifest['dates']] == expected_months

          observed = 0
          for item in manifest['dates']:
              if item['status'] not in {'observed_single_scene','observed_monthly_composite'}:
                  assert item['files'] == {}, item
                  continue
              observed += 1
              assert item['clear_pixel_pct'] >= 5.0, item
              assert set(item['files']) == expected_bands, item
              dims = set()
              for band in sorted(expected_bands):
                  path = plot_dir / item['files'][band]
                  assert path.exists(), path
                  with Image.open(path) as image:
                      assert image.mode == 'LA', (path, image.mode)
                      dims.add(image.size)
              assert len(dims) == 1, (item['month'], dims)
          assert observed >= 8, observed
          print(f'Validated PLOT_076 spectral assets: observed={observed}/12')
          PY

      - name: Commit generated visualization assets and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plots/76/spectral_manifest.json data/plots/76/band_*.png
          if ! git diff --cached --quiet; then
            git commit -m "Build 13-STC Spectral Studio assets"
          fi
          git fetch origin main gh-pages
          git rebase origin/main
          git push origin HEAD:main
          git push --force-with-lease origin HEAD:gh-pages
