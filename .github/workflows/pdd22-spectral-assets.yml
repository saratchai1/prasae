name: PDD22 Spectral Studio assets

on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - build_pdd22_spectral_assets.py
      - .github/workflows/pdd22-spectral-assets.yml

permissions:
  contents: write

concurrency:
  group: pdd22-spectral-assets
  cancel-in-progress: true

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-verified.txt

      - name: Install dependencies
        run: pip install -r requirements-verified.txt

      - name: Validate inputs
        run: |
          python -m py_compile build_pdd22_spectral_assets.py process_pdd22_satellite_pipeline.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/pdd22/plots_catalog.json').read_text(encoding='utf-8'))
          assert len(p)==22
          assert round(sum(float(x['area_rai']) for x in p),2)==6775.53
          PY

      - name: Build spectral shard
        env:
          PDD22_SPECTRAL_SHARD_COUNT: '4'
          PDD22_SPECTRAL_SHARD_INDEX: ${{ matrix.shard }}
          PDD22_SPECTRAL_WORKERS: '2'
        run: python build_pdd22_spectral_assets.py

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: pdd22-spectral-${{ matrix.shard }}
          path: data/pdd22_spectral
          retention-days: 7

  publish:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: pdd22-spectral-*
          path: data/pdd22_spectral
          merge-multiple: true

      - name: Validate merged package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/pdd22_spectral/plots')
          dirs=sorted([p for p in root.iterdir() if p.is_dir()])
          assert len(dirs)==22, len(dirs)
          total=0
          for d in dirs:
              m=json.loads((d/'spectral_manifest.json').read_text(encoding='utf-8'))
              assert m['rules']['pdd_participating_boundary_only'] is True
              assert m['rules']['frozen_clean_scene_selection'] is True
              assert m['bands']==['B02','B03','B04','B08','B11','B12']
              assert len(m['dates'])==12
              total += sum(x['status']=='available' for x in m['dates'])
          index={
              'schema_version':'2.0-pdd22',
              'plot_count':22,
              'observation_slots':264,
              'available_plot_months':total,
              'bands':['B02','B03','B04','B08','B11','B12'],
              'source':'PDD22 cleaned Sentinel-2 frozen scene selections',
              'visualization_only':True
          }
          Path('data/pdd22_spectral/manifest.json').write_text(json.dumps(index,indent=2),encoding='utf-8')
          print('Available spectral plot-months:', total)
          PY

      - name: Commit spectral assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pdd22_spectral
          if git diff --cached --quiet; then
            echo "No spectral changes"
            exit 0
          fi
          git commit -m "Build PDD22 cleaned six-band spectral assets"
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin HEAD:gh-pages
