name: Rebuild verified 12-date dataset

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-12-date-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-verified.txt

      - name: Re-extract exact plot geometry
        run: python extract_kmz_plots.py

      - name: Build 12-date Sentinel-2 dataset
        env:
          PRASAE_WORKERS: '4'
        run: python process_verified_12_dates.py

      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plots_catalog.json data/plots.geojson data/timeseries_verified_12.json data/plots
          if git diff --cached --quiet; then
            echo "No regenerated data changes"
            exit 0
          fi
          git commit -m "Rebuild verified 12-date Sentinel-2 dataset"
          git push
