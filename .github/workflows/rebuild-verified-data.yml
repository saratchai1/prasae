name: Rebuild verified 12-date dataset

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - process_verified_12_dates.py
      - requirements-verified.txt
      - .github/workflows/rebuild-verified-data.yml

permissions:
  contents: write

concurrency:
  group: verified-12-date-rebuild
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-verified.txt

      - name: Install dependencies
        run: pip install -r requirements-verified.txt

      - name: Validate Python syntax
        run: python -m py_compile process_verified_12_dates.py extract_kmz_plots.py

      - name: Smoke-test one plot against live Sentinel-2 STAC
        env:
          PRASAE_WORKERS: '1'
          PRASAE_MAX_SCENES: '2'
          PRASAE_PLOT_IDS: '1'
        run: python process_verified_12_dates.py

  rebuild:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-verified.txt

      - name: Install dependencies
        run: pip install -r requirements-verified.txt

      - name: Re-extract exact plot geometry
        run: python extract_kmz_plots.py

      - name: Build multi-index 12-date Sentinel-2 dataset
        env:
          PRASAE_WORKERS: '6'
          PRASAE_MAX_SCENES: '5'
        run: python process_verified_12_dates.py

      - name: Commit, rebase onto latest main, and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plots_catalog.json data/plots.geojson data/timeseries_verified_12.json data/plots
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild multi-index 12-date mangrove metrics"
          fi
          git fetch origin main gh-pages
          git rebase origin/main
          git push origin HEAD:main
          git push --force-with-lease origin HEAD:gh-pages
